name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Spotless and Detekt
        run: ./gradlew spotlessCheck detekt

      - name: Build and test
        run: ./gradlew build
name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  setup-vm:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set exec perm for gradle
        run: chmod +x gradlew

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Spotless and detekt Check
        run: ./gradlew spotlessCheck detekt

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Build test
        run: ./gradlew build